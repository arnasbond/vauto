name: Database backup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (meta only, no pg_dump)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # Weekly Sunday 03:15 UTC — logical dump artifact + recovery-info check
    - cron: "15 3 * * 0"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install server deps + PostgreSQL 18 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          pg_dump --version
          npm ci --prefix server

      - name: Check Render PITR / recovery-info
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DB_NAME: vauto-db
        run: |
          set +e
          node scripts/check-render-db-recovery.mjs
          CODE=$?
          set -e
          # 0 = paid + OK, 2 = free (fail hard), other = soft warn and continue dump
          if [ "$CODE" = "2" ]; then
            echo "Free Postgres cannot be backed up via PITR — aborting."
            exit 2
          fi
          if [ "$CODE" != "0" ]; then
            echo "Recovery-info check returned $CODE — continuing with logical pg_dump."
          fi

      - name: Logical pg_dump backup
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DB_NAME: vauto-db
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          PGSSLMODE: require
        run: |
          set -euo pipefail
          URL=$(node scripts/resolve-render-database-url.mjs --print)
          case "$URL" in
            *sslmode=*) ;;
            *\?*) URL="${URL}&sslmode=require" ;;
            *) URL="${URL}?sslmode=require" ;;
          esac
          export DATABASE_URL="$URL"
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/backup-db.mjs $ARGS
          node scripts/verify-media-urls.mjs || true
          ls -lah backups || true

      - name: Upload backup artifacts
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vauto-db-backup-${{ github.run_id }}
          path: backups/*
          retention-days: 30
          if-no-files-found: error
