name: Restore listing covers from gallery

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install server deps
        working-directory: server
        run: npm ci
      - name: Restore covers (galleryUrls → image)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DB_NAME: vauto-db
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          URL=$(node scripts/resolve-render-database-url.mjs --print)
          case "$URL" in
            *sslmode=*) ;;
            *\?*) URL="${URL}&sslmode=require" ;;
            *) URL="${URL}?sslmode=require" ;;
          esac
          export DATABASE_URL="$URL"
          export NODE_TLS_REJECT_UNAUTHORIZED=0
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="--dry-run"; fi
          node server/scripts/restore-real-listing-covers.mjs $ARGS
          node -e "
            const {Client}=require('pg');
            (async()=>{
              const c=new Client({connectionString:process.env.DATABASE_URL,ssl:{rejectUnauthorized:false}});
              await c.connect();
              const {rows}=await c.query(\`SELECT id, title, left(image,120) AS image,
                attributes->>'galleryUrls' AS gallery
                FROM listings
                WHERE title ILIKE '%HOHNER%' OR title ILIKE '%gitar%'
                ORDER BY created_at DESC LIMIT 5\`);
              console.log(JSON.stringify(rows,null,2));
              const stock=await c.query(\`SELECT COUNT(*)::int AS c FROM listings
                WHERE image ILIKE '%unsplash.com%' OR image ILIKE '%picsum.photos%'\`);
              console.log('unsplash_covers_remaining', stock.rows[0].c);
              await c.end();
            })().catch(e=>{console.error(e);process.exit(1);});
          "
