name: CI

# Production branch: master only.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vauto_test
          POSTGRES_USER: vauto_test
          POSTGRES_PASSWORD: vauto_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://vauto_test:vauto_test_pass@localhost:5432/vauto_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Install server dependencies
        run: npm run server:install

      - name: Typecheck server
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Build server
        run: npm run server:build

      - name: API Docker image (Render Dockerfile + ./server context)
        run: |
          set -euo pipefail
          docker build -f server/Dockerfile -t vauto-api:ci ./server
          docker run --rm --entrypoint sh vauto-api:ci -c \
            'set -e; test -f /app/dist/index.js; test -d /app/migrations; test -f /app/dist/shared/marketplace-domain/index.js; ls -la /app/dist /app/migrations | head -n 80'

      - name: Server validation smoke
        run: node scripts/validation-smoke.mjs

      - name: Auth E2E offline checks
        run: npm run test:auth-e2e

      - name: AI golden path (offline)
        run: npm run test:ai-golden

      - name: Stage 10 AI foundation
        run: npm run test:ai-foundation --prefix server

      - name: Stage 10A Intent
        run: npm run test:ai-intent --prefix server

      - name: Stage 10B Search
        run: npm run test:ai-search --prefix server

      - name: Stage 10C Sell
        run: npm run test:ai-sell --prefix server

      - name: Stage 10D Market Intelligence
        run: npm run test:ai-market --prefix server

      - name: Stage 10E VAUTO Score
        run: npm run test:vauto-score --prefix server

      - name: Stage 10F Buyer Match
        run: npm run test:buyer-match --prefix server

      - name: Stage 10G Compare Engine
        run: npm run test:compare-engine --prefix server

      - name: Stage 10H AI Watch
        run: npm run test:ai-watch --prefix server

      - name: Stage 10I Red Team
        run: npm run test:ai-red-team --prefix server

      - name: Stage 10J Integration (PostgreSQL)
        run: npm run test:stage10-integration --prefix server

      - name: Stage 10K HTTP Auth Integration
        run: npm run test:stage10-http-integration --prefix server

      - name: Stage 16 security / authz / migration chain
        run: npm run test:stage16-security --prefix server

      - name: F9 release-readiness pack (auth role boundary + draft facts)
        run: npx tsx --test src/routes/__tests__/f9-user-authority.test.ts src/ai/__tests__/f9-draft-fact-preservation.test.ts src/tests/conversational-state-machine.test.ts
        working-directory: server

      - name: F9 frontend unit pack (category parity + quick replies + missing guide + chat harness)
        run: node --import tsx --test src/lib/__tests__/f9-category-guards.test.ts src/lib/__tests__/f9-quick-reply-contract.test.ts src/lib/__tests__/f9-missing-guide.test.ts src/lib/__tests__/chat-slot-binding.test.ts src/lib/__tests__/legacy-copy-guard.test.ts

      - name: Stage 16C migrate from zero (disposable Postgres)
        run: node scripts/migrate-from-zero.mjs
        env:
          TEST_DATABASE_URL: postgres://vauto_test:vauto_test_pass@localhost:5432/vauto_test

      - name: Stage 11A Transaction State Machine
        run: npm run test:transaction-state-machine --prefix server

      - name: Stage 11B Structured Offers
        run: npm run test:structured-offers --prefix server

      - name: Stage 11C Transaction Chat
        run: npm run test:transaction-chat --prefix server

      - name: Stage 11D Negotiation Copilot
        run: npm run test:negotiation-copilot --prefix server

      - name: Stage 11E Deal Room
        run: npm run test:deal-room --prefix server

      - name: Stage 11E.2 Real PostgreSQL pg.Pool gate
        run: npm run test:real-postgres-pool --prefix server
        env:
          TEST_DATABASE_URL: postgres://vauto_test:vauto_test_pass@localhost:5432/vauto_test

      - name: Stage 11F.1 Payment Domain & Ledger
        run: npm run test:payment-ledger --prefix server

      - name: Stage 11F.2 Stripe PaymentIntent Integration
        run: npm run test:stripe-payment-intent --prefix server

      - name: Stage 11F.3 Stripe Signed Webhooks
        run: npm run test:stripe-webhooks --prefix server

      - name: Stage 11F.4 Funds Transfer & Refund
        run: npm run test:funds-transfer --prefix server

      - name: Stage 11F.5 Financial Reconciliation & Red Team
        run: npm run test:financial-reconciliation --prefix server

      - name: Stage 11G.1 Delivery & Shipping
        run: npm run test:delivery-shipping --prefix server

      - name: Stage 11H.1 Dispute Resolution
        run: npm run test:dispute-resolution --prefix server

      - name: Stage 11I.1 Reputation Engine
        run: npm run test:reputation-engine --prefix server

      - name: Stage 11J Universal Transaction Core
        run: npm run test:universal-core --prefix server

      - name: Stage 13A Category Domain
        run: npm run test:category-domain --prefix server

      - name: Stage 13B Faceted Search
        run: npm run test:faceted-search --prefix server

      - name: Stage 13C Universal Deal Room
        run: npm run test:deal-room-13c --prefix server

      - name: Stage 13C.1 PostgreSQL concurrency
        run: npm run test:deal-room-13c-pg --prefix server

      - name: Conductor kill-switch drill
        run: node scripts/conductor-kill-switch-drill.mjs

      - name: Catalog audit
        run: npm run audit:catalog

      - name: Fast search validation
        run: npm run validate:fast-search

  api-integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Live API health + listing smoke
        run: npm run test:api-integration
        env:
          VAUTO_API_URL: https://vauto-api.onrender.com

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      CI: "true"
      PLAYWRIGHT_REUSE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Sync runtime config
        run: npm run sync:runtime-config
        env:
          NEXT_PUBLIC_API_URL: https://vauto-api.onrender.com
          NEXT_PUBLIC_VAUTO_CONDUCTOR: "1"

      - name: Build static export
        run: npm run build:e2e

      - name: Install server dependencies (Stage 12A harness)
        run: npm run server:install

      - name: Run authenticated Deal Room E2E pack (single build/server)
        run: |
          npx playwright test --project=e2e-legacy \
            e2e/stage12a-deal-room-flows.spec.ts \
            e2e/stage13c-deal-room.spec.ts
        env:
          E2E_MINT_REAL_JWT: "1"
          JWT_SECRET: vauto-dev-secret-change-in-production

      - name: Run critical browser E2E pack (single build/server)
        run: |
          npx playwright test --project=e2e-legacy \
            e2e/stage12b-user-comprehension.spec.ts \
            e2e/stage13b-faceted-filters.spec.ts \
            e2e/smoke.spec.ts \
            e2e/ai-assistant-restore.spec.ts \
            e2e/auth.spec.ts \
            e2e/ai-conductor-runtime.spec.ts \
            e2e/ai-conductor-runtime-live.spec.ts \
            e2e/ai-conductor-off.spec.ts \
            e2e/master-wave1-theme-semantics.spec.ts \
            e2e/vin-review-confirmation.spec.ts

      - name: Run conductor E2E (NEXT_PUBLIC_VAUTO_CONDUCTOR=1)
        run: npm run test:e2e:conductor

      - name: Run enterprise business E2E pack
        run: npx playwright test --project=e2e-enterprise
