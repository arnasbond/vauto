name: Sync Cloudinary to Render

# Mirror CLOUDINARY_* from Vercel production (or GH secrets) onto Render API,
# then redeploy so publish uploads work. Uploads are server-side on Render.

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull Cloudinary env and sync + redeploy Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d8q3fk6q1p3s739fd9h0
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "RENDER_API_KEY not set"
            exit 1
          fi

          if [ -z "${CLOUDINARY_API_KEY:-}" ] || [ -z "${CLOUDINARY_API_SECRET:-}" ] || [ -z "${CLOUDINARY_CLOUD_NAME:-}" ]; then
            if [ -n "${VERCEL_TOKEN:-}" ] && [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
              echo "Pulling Cloudinary vars via vercel env pull..."
              npx --yes vercel@39 env pull /tmp/vauto-cloudinary.env --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"
              set -a
              # shellcheck disable=SC1091
              . /tmp/vauto-cloudinary.env
              set +a
            fi
          fi

          node scripts/sync-cloudinary-to-render.mjs
          rm -f /tmp/vauto-cloudinary.env

      - name: Wait for API health features.cloudinary
        run: |
          set -euo pipefail
          echo "Waiting for https://vauto-api.onrender.com/api/health features.cloudinary=true..."
          for i in $(seq 1 36); do
            BODY=$(curl -sf "https://vauto-api.onrender.com/api/health" || true)
            if echo "$BODY" | grep -q '"cloudinary":true'; then
              echo "OK: features.cloudinary=true"
              echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('infra',{}).get('cloudinary'))"
              exit 0
            fi
            echo "  attempt $i/36 — waiting..."
            sleep 10
          done
          echo "Timed out waiting for features.cloudinary=true"
          curl -sf "https://vauto-api.onrender.com/api/health" | python3 -m json.tool | head -100 || true
          exit 1
